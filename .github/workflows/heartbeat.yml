name: Heartbeat Supabase + Discover

# 1) Evita que o Supabase (plano free) pause o projeto por 7 dias de inatividade.
# 2) Atualiza as noticias cientificas do Discover (RSS -> resumo PT por Gemini).
# Roda todo dia as 12:00 UTC e pode ser disparado manualmente (workflow_dispatch).

on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 Brasilia — ciencia da manha
    - cron: "0 23 * * *"   # 20:00 Brasilia — ciencia da noite
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend DrNutri
        run: |
          URL="https://gcqgbtaraiewbayhkvum.supabase.co/functions/v1/drnutri-subscribe/api/subscribe/status?email=heartbeat@drnutri.app"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL")
          echo "Resposta do backend: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "FALHOU — backend nao respondeu"
            exit 1
          fi
      - name: Atualizar noticias do Discover
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "https://gcqgbtaraiewbayhkvum.supabase.co/functions/v1/drnutri-proxy/api/news/refresh")
          echo "Refresh de noticias: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "ALERTA: refresh de noticias falhou (backend segue vivo)"
          fi
